name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check every plugin lib
        run: |
          for f in packages/*/lib/*.js; do
            echo "checking $f"
            node --check "$f"
          done
